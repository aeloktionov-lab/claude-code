# Nginx reverse proxy for croid.ru — Node app runs on 127.0.0.1:3000 via systemd.
# Copy to /etc/nginx/sites-available/croid.ru, symlink into sites-enabled,
# then run certbot (see docs/deploy-regru.md) to add HTTPS.

server {
    listen 80;
    server_name croid.ru www.croid.ru;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
