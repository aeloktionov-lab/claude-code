<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Товар — ФОРМА.PRO</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="catalog">
  <header id="site-header" class="site-header"></header>

  <section class="container" style="padding-top:32px;">
    <div id="product-root">Загрузка…</div>
  </section>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="/js/common.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    let selectedSize = null;
    let selectedColor = null;

    function chipHtml(list, type, selected) {
      return list
        .map(
          (v) =>
            `<span class="chip ${v === selected ? 'selected' : ''}" data-type="${type}" data-value="${v}">${v}</span>`
        )
        .join('');
    }

    fetch(`/api/products/${id}`)
      .then((r) => {
        if (!r.ok) throw new Error('not found');
        return r.json();
      })
      .then((p) => {
        selectedSize = p.sizes[0];
        selectedColor = p.colors[0];
        const root = document.getElementById('product-root');
        root.innerHTML = `
          <div class="product-detail">
            <div><img src="/${p.img}" alt="${p.name}" /></div>
            <div>
              <div class="cat" style="color:var(--accent);font-weight:600;">${p.category}</div>
              <h1>${p.name}</h1>
              <p class="muted">${p.description}</p>
              <div class="price">${p.price.toLocaleString('ru-RU')} ₽ / шт</div>
              <div class="min-qty muted">Минимальная партия — ${p.minQty} шт</div>

              <div class="field-row">
                <label>Цвет</label>
                <div class="chips" id="color-chips">${chipHtml(p.colors, 'color', selectedColor)}</div>
              </div>
              <div class="field-row">
                <label>Размер</label>
                <div class="chips" id="size-chips">${chipHtml(p.sizes, 'size', selectedSize)}</div>
              </div>
              <div class="field-row">
                <label>Количество (шт)</label>
                <input type="number" id="qty-input" min="${p.minQty}" step="1" value="${p.minQty}" />
              </div>

              <button class="btn" id="add-btn">Добавить в заявку</button>
              <div id="add-feedback" class="muted" style="margin-top:10px;"></div>
            </div>
          </div>
        `;

        root.querySelectorAll('.chip').forEach((chip) => {
          chip.addEventListener('click', () => {
            const type = chip.dataset.type;
            const container = document.getElementById(`${type}-chips`);
            container.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));
            chip.classList.add('selected');
            if (type === 'color') selectedColor = chip.dataset.value;
            if (type === 'size') selectedSize = chip.dataset.value;
          });
        });

        document.getElementById('add-btn').addEventListener('click', () => {
          const qtyInput = document.getElementById('qty-input');
          let qty = parseInt(qtyInput.value, 10) || p.minQty;
          if (qty < p.minQty) qty = p.minQty;
          addToCart({ id: p.id, name: p.name, price: p.price, qty, size: selectedSize, color: selectedColor });
          document.getElementById('add-feedback').textContent = `Добавлено: ${qty} шт (${selectedColor}, ${selectedSize}). `;
          const link = document.createElement('a');
          link.href = '/cart.html';
          link.textContent = 'Перейти к заявке →';
          link.style.color = 'var(--accent)';
          link.style.fontWeight = '600';
          document.getElementById('add-feedback').appendChild(link);
        });
      })
      .catch(() => {
        document.getElementById('product-root').innerHTML =
          '<div class="empty-state">Товар не найден. <a href="/catalog.html">Вернуться в каталог</a></div>';
      });
  </script>
</body>
</html>
