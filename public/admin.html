<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админка — croid.ru</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="admin">
  <header id="site-header" class="site-header"></header>

  <section class="container" style="padding-top:32px;">
    <h2 class="section-title">Заявки на заказ</h2>
    <p class="section-sub muted">Доступ защищён паролем (переменная окружения ADMIN_PASSWORD на сервере).</p>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="orders-table">
        <thead>
          <tr><th>#</th><th>Дата</th><th>Компания</th><th>Контакт</th><th>Телефон</th><th>Позиции</th><th>Сумма</th><th>Комментарий</th></tr>
        </thead>
        <tbody><tr><td colspan="8">Загрузка…</td></tr></tbody>
      </table>
    </div>

    <h2 class="section-title" style="margin-top:40px;">Обращения (форма контактов)</h2>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="leads-table">
        <thead>
          <tr><th>#</th><th>Дата</th><th>Имя</th><th>Телефон</th><th>Email</th><th>Сообщение</th></tr>
        </thead>
        <tbody><tr><td colspan="6">Загрузка…</td></tr></tbody>
      </table>
    </div>
  </section>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script>
    fetch('/api/admin/orders')
      .then((r) => r.json())
      .then((orders) => {
        const tbody = document.querySelector('#orders-table tbody');
        if (orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8">Пока нет заявок.</td></tr>';
          return;
        }
        tbody.innerHTML = orders
          .map(
            (o) => `
          <tr>
            <td>${o.id}</td>
            <td>${o.created_at}</td>
            <td>${o.company}</td>
            <td>${o.contact_name}</td>
            <td>${o.phone}</td>
            <td>${o.items.map((i) => `${i.name} × ${i.qty} (${i.color || '—'}, ${i.size || '—'})`).join('<br/>')}</td>
            <td>${o.total.toLocaleString('ru-RU')} ₽</td>
            <td>${o.comment || ''}</td>
          </tr>`
          )
          .join('');
      });

    fetch('/api/admin/leads')
      .then((r) => r.json())
      .then((leads) => {
        const tbody = document.querySelector('#leads-table tbody');
        if (leads.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">Пока нет обращений.</td></tr>';
          return;
        }
        tbody.innerHTML = leads
          .map(
            (l) => `
          <tr>
            <td>${l.id}</td>
            <td>${l.created_at}</td>
            <td>${l.name}</td>
            <td>${l.phone || ''}</td>
            <td>${l.email || ''}</td>
            <td>${l.message || ''}</td>
          </tr>`
          )
          .join('');
      });
  </script>
</body>
</html>
